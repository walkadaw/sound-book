<app-header [class.fixed-menu]="showMenu$ | async"></app-header>
<main class="container" [class.show-menu]="showMenu$ | async" [style.font-size.em]="fontSize$ | async">
  <app-main-page class="menu"></app-main-page>
  @if ((showMenu$ | async) !== true) {
    <router-outlet></router-outlet>
  }
</main>
<app-footer></app-footer>
