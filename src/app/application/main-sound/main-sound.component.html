<a class="skip-link" href="#main-content" (click)="focusMain($event)">Перайсці да зместу</a>
<app-header [class.fixed-menu]="showMenu()"></app-header>
<main
  #main
  id="main-content"
  tabindex="-1"
  class="container"
  [class.show-menu]="showMenu()"
  [style.font-size.em]="fontSize()"
>
  @if (renderMenu()) {
    <app-main-page class="menu"></app-main-page>
  }
  @if (!showMenu()) {
    <router-outlet></router-outlet>
  }
</main>
<app-footer></app-footer>
