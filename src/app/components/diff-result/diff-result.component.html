<div style="white-space: pre">
  @for (change of diff; track change) {
    @if (change.removed && change.value.trim()) {
      <span style="color: red">{{ change.value }}</span>
      }@if (change.added) {
      <span style="color: green">{{ change.value }}</span>
      }@if (!change.added && !change.removed) {
      {{ change.value }}
    }
  }
</div>
