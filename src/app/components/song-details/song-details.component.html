@if (selectedSong(); as selectedSong) {
  <article>
    <header class="entry-header">
      <div class="entry-main">
        <div class="entry-heading">
          <p class="entry-number">
            <span class="cdk-visually-hidden">Нумар у папяровым спеўніку</span>
            {{ selectedSong.songId }}.
          </p>
          <h1 class="entry-title song-name">{{ selectedSong.title }}</h1>
        </div>
        @if (tags().length) {
          <p class="entry-title-meta meta">
            Тэгі:
            @for (tag of tags(); track tag.id) {
              <button type="button" class="tag-link" (click)="showTag(tag.id)">
                {{ tag.name }}<span class="cdk-visually-hidden">: усе песні з тэгам</span></button
              >{{ $last ? '' : ',' }}
            }
          </p>
        }
        @if (showChord()) {
          <app-song-key class="entry-key" [(selectedTranspilation)]="selectedTranspilation"></app-song-key>
        }
      </div>
      <div class="entry-actions">
        <button
          mat-icon-button
          [attr.aria-label]="isFavoriteSong() ? 'Выдаліць з абраных' : 'Дадаць у абраныя'"
          (click)="toggleFavorite(selectedSong.id)"
        >
          <mat-icon>{{ isFavoriteSong() ? 'favorite' : 'favorite_border' }}</mat-icon>
        </button>
        <button mat-icon-button aria-label="Дзеянні з песняй" [matMenuTriggerFor]="songMenu">
          <mat-icon>more_horiz</mat-icon>
        </button>
      </div>
    </header>
    <mat-menu #songMenu="matMenu">
      <app-playlist-menu
        [songId]="selectedSong.id"
        (selectedPlaylist)="addedSongToPlaylist($event.dateCreate, selectedSong.id)"
      ></app-playlist-menu>
      <mat-divider />
      <app-song-view-settings />
    </mat-menu>
    <app-song-lyrics
      [rows]="selectedSong.rows"
      [showChord]="showChord()"
      [transpilation]="selectedTranspilation()"
    ></app-song-lyrics>
    <app-song-media [songId]="selectedSong.id" />
  </article>
}
