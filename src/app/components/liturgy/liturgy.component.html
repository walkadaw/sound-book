@if (liturgy(); as liturgy) {
  <article class="content">
    <h2>{{ liturgy.title }}</h2>
    <div [innerHTML]="liturgy.article"></div>
    <i
      >Тэкст літургіі узяты з сайта
      <a href="https://catholic.by" target="_blank" rel="noopener noreferrer">Catholic.by</a></i
    >
  </article>
} @else {
  @if (isLoading()) {
    <mat-spinner></mat-spinner>
  } @else {
    <h3>Не атрымалася атрымаць сэгдошене чытанне!</h3>
    <p>Праверце сваё злучэнне з інтэрнэтам або паспрабуйце пазней.</p>
  }
}
