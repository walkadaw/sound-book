<div class="reveal">
  <div class="slides">
    @if (slideList().length) {
      @for (slides of slideList(); track $index) {
        @for (slide of slides.slides; track slide) {
          <section [style.font-size.px]="slide.fontSize">
            <span>{{ slide.text }}</span>
          </section>
        }
      }
    } @else {
      <section>Не дададзены ні адзін слайд</section>
    }
  </div>
</div>

@if (isReady()) {
  <app-presentation-menu [slideList]="slideList()" [program]="program" />
}
