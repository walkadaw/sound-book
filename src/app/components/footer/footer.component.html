<footer class="site-footer">
  <div class="say-live" aria-live="polite">
    @if (words(); as words) {
      <div class="say-block">
        <blockquote class="text" lang="ru">
          {{ words.content }}
          <cite class="alias">{{ words.alias }}</cite>
          <button type="button" class="close" aria-label="Закрыць цытату" (click)="close()">
            <mat-icon>close</mat-icon>
          </button>
        </blockquote>
      </div>
    }
  </div>
  <button
    type="button"
    class="jesus"
    [class.say]="words()"
    aria-label="Паказаць цытату з Бібліі"
    (click)="onClick()"
  ></button>
</footer>
