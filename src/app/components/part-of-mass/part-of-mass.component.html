<article class="content">
  <h1 class="page-title">Часткі імшы</h1>

  @for (song of songs(); track song) {
    <div class="lyrics">
      <h2 class="entry-title song-subtitle" itemprop="name">
        {{ song?.title }}
      </h2>
      @for (line of song.text; track $index; let i = $index) {
        <div class="line-container">
          @if (showChord() && song.chord[i]) {
            <app-chord-list class="chord" [chords]="song.chord[i]" [transpilation]="0"></app-chord-list>
          }
          <span>{{ line }}</span>
        </div>
      }
    </div>
  }
</article>
