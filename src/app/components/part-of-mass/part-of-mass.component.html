<article class="content" *appLet="showChord$ | async as showChord">
  <h2>Частки имшы</h2>

  @for (song of songs$ | async; track song) {
    <div class="lyrics" [class.chord-right]="song.chordPosition === 'right'">
      <h5 class="entry-title" itemprop="name">
        {{ song?.title }}
      </h5>
      @for (line of song.text; track line; let i = $index) {
        <div class="line-container">
          @if (showChord && song.chord[i]) {
            <app-chord-list class="chord" [chords]="song.chord[i]" [transpilation]="0"></app-chord-list>
          }
          <span>{{ line }}</span>
        </div>
      }
    </div>
  }
</article>
