<div class="container">
  <mat-icon class="burger-menu" [matMenuTriggerFor]="menu">menu</mat-icon>
  <div class="logo" [class.hide-logo]="searchInputInFocus" (click)="toggleMainMenu()">
    <h2>Спеўнік</h2>
  </div>
  <app-song-search class="sticky-search" (isFocusInput)="onInputChangeFocus($event)"></app-song-search>

  <div class="filter-panel">
    <div class="filter-panel-inner">
      <div
        class="filter-panel-scroll"
        #chipScroll
        role="radiogroup"
        aria-label="Катэгорыя пошуку"
        (scroll)="onChipScroll()"
        (window:resize)="onChipScroll()"
      >
        @for (item of filters; track item.id) {
          <button
            type="button"
            role="radio"
            class="filter-chip"
            [class.selected]="item.id === selectedFilter().id"
            [attr.aria-checked]="item.id === selectedFilter().id"
            (mousedown)="$event.preventDefault()"
            (click)="selectFilter(item.id)"
          >
            @if (item.icon) {
              <mat-icon [svgIcon]="item.icon"></mat-icon>
            } @else {
              <mat-icon>search</mat-icon>
            }
            <span>{{ item.title }}</span>
          </button>
        }
      </div>
      <div class="fade fade-left" [class.visible]="canScrollLeft()"></div>
      <div class="fade fade-right" [class.visible]="canScrollRight()"></div>
    </div>
  </div>
</div>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="toggleMainMenu(true)">
    <mat-icon>library_music</mat-icon>
    <span>Усе песні</span>
  </button>
  <button mat-menu-item routerLink="/favorite">
    <mat-icon>favorite</mat-icon>
    <span>Закладкі</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item [matMenuTriggerFor]="collections" (menuOpened)="onSubmenuOpened()">
    <mat-icon>queue_music</mat-icon>
    <span>Плэйлісты</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/part-of-mass">
    <mat-icon>library_music</mat-icon>
    <span>Часткі імшы</span>
  </button>
  <button mat-menu-item routerLink="/liturgy">
    <mat-icon>auto_stories</mat-icon>
    <span>Чытанне дня</span>
  </button>
  <button mat-menu-item routerLink="/gadzinki">
    <mat-icon svgIcon="icon-maria"></mat-icon>
    <span>Гадзінкі</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/presentation">
    <mat-icon>slideshow</mat-icon>
    <span>Презентація</span>
  </button>
  <!-- <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/generator">
    <mat-icon>notifications_off</mat-icon>
    <span>Генератор прізентаціі</span>
  </button> -->
  <!-- <button mat-menu-item routerLink="/generator/docx">
  <mat-icon>notifications_off</mat-icon>
  <span>Создание бумажней версии</span>
</button> -->
  <mat-divider></mat-divider>
  @if (isAuth()) {
    <button mat-menu-item routerLink="/admin/add">
      <mat-icon>add</mat-icon>
      <span>Дадать спеу</span>
    </button>
    <mat-divider></mat-divider>
  }
  <button mat-menu-item [matMenuTriggerFor]="settings" (menuOpened)="onSubmenuOpened()">
    <mat-icon>settings</mat-icon>
    <span>Налады</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/about">
    <mat-icon>accessibility_new</mat-icon>
    <span>Пра нас</span>
  </button>
</mat-menu>

<mat-menu #settings="matMenu" [class.submenu-opening-guard]="submenuOpening()">
  <app-settings-menu></app-settings-menu>
</mat-menu>

<mat-menu #collections="matMenu" [class.submenu-opening-guard]="submenuOpening()">
  <app-playlist-menu (selectedPlaylist)="goToPlaylist($event)"></app-playlist-menu>
</mat-menu>
