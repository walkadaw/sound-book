<div class="row" (click)="$event.stopPropagation()">
  <mat-slide-toggle labelPosition="before" [checked]="showChord()" (change)="toggleChord($event)">
    Паказваць акорды:
  </mat-slide-toggle>
</div>
@if (showChord()) {
  <div class="row" animate.enter="row--enter" animate.leave="row--leave" (click)="$event.stopPropagation()">
    <mat-slide-toggle labelPosition="before" [checked]="shortChord()" (change)="toggleShortChord($event)">
      Кароткія акорды (Am → a):
    </mat-slide-toggle>
  </div>
}
<div class="row row--font" (click)="$event.stopPropagation()">
  <span id="font-size-label">Памер шрыфта:</span>
  <div class="font-size" role="group" aria-labelledby="font-size-label">
    <button
      mat-icon-button
      class="font-size__step"
      type="button"
      aria-label="Паменшыць шрыфт"
      [disabled]="!canDecrease()"
      (click)="changeFontSize(-1)"
    >
      <mat-icon>remove</mat-icon>
    </button>
    <button
      class="font-size__value"
      type="button"
      aria-label="Скінуць памер шрыфта да 100%"
      title="Скінуць да 100%"
      aria-live="polite"
      (click)="resetFontSize()"
    >
      {{ fontSizePercent() }}%
    </button>
    <button
      mat-icon-button
      class="font-size__step"
      type="button"
      aria-label="Павялічыць шрыфт"
      [disabled]="!canIncrease()"
      (click)="changeFontSize(1)"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
