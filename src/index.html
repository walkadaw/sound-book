<!doctype html>
<html lang="be">
  <head>
    <meta charset="utf-8" />
    <title>Спеўнік</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Спеўнік — зборнік духоўных песень з акордамі: пошук па назве і тэксце, транспанаванне, плэйлісты і рэжым прэзентацыі."
    />
    <meta property="og:site_name" content="Спеўнік" />
    <meta property="og:locale" content="be_BY" />
    <script>
      // Applies a manually chosen theme before first paint; ThemeService takes over after bootstrap.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <!-- Shown until Angular bootstraps: on a first visit it waits for the song list to download. -->
    <app-root>
      <style>
        .app-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          height: 100vh;
          font-family: Helvetica, Arial, sans-serif;
          font-size: 28px;
          font-weight: 700;
          color: var(--mat-sys-on-surface, #333332);
        }
        .app-loading::after {
          content: '';
          width: 32px;
          height: 32px;
          border: 3px solid var(--mat-sys-outline-variant, #ddd);
          border-top-color: var(--mat-sys-primary, #284a66);
          border-radius: 50%;
          animation: app-loading-spin 0.8s linear infinite;
        }
        @keyframes app-loading-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .app-loading::after {
            animation-duration: 3s;
          }
        }
      </style>
      <div class="app-loading" role="status" aria-label="Загрузка">Спеўнік</div>
    </app-root>
    <noscript>Каб карыстацца Спеўнікам, уключыце JavaScript.</noscript>
  </body>
</html>
